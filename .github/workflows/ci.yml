name: ci

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read
  # gitleaks-action lists a PR's commits via the API on pull_request events.
  pull-requests: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # gitleaks-action diffs the PR's base commit against its head on
          # pull_request events; a shallow (depth=1) checkout only has the
          # head commit and fails with "unknown revision" as soon as a PR
          # carries more than one commit.
          fetch-depth: 0

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      - name: Unused code (vulture)
        run: vulture

      - name: Secrets scan (gitleaks)
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e  # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Dependency vulnerability scan (pip-audit)
        run: pip-audit .

      - name: Test
        run: pytest
