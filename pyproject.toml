[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nobrokerhood-mcp"
version = "0.1.0"
description = "NoBrokerHood gate management — CLI and MCP server for pre-approving deliveries and visitors"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "requests~=2.32",
    "mcp[cli]~=2.0",
]

[project.optional-dependencies]
dev = [
    "ruff~=0.8.0",
    "pytest~=8.0",
    "pytest-asyncio~=0.24.0",
    "pre-commit~=4.0",
    "vulture~=2.13",
    "pip-audit~=2.7",
]

[project.scripts]
nbh = "nobrokerhood.cli:main"
nobrokerhood-mcp = "nobrokerhood.server:main"

[tool.hatch.build.targets.wheel]
packages = ["nobrokerhood"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "ARG", # unused function arguments
    "ERA", # commented-out code
    "RUF", # ruff-specific rules
]

[tool.vulture]
paths = ["nobrokerhood"]
min_confidence = 80
exclude = ["tests/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
